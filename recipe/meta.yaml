{% set name = environ.get('ANACONDA_PACKAGE', "rivet")|string|lower %}

{% set versions = {
    "4.1.3": "2ad5ff8b1060821e4ccfb32ee28576c2d6c59fb3b69e59b7e303a6ccfefbd284",
    "3.1.11": "89f359564c124dbccbab7a4ac7c8fa5edcee70e401e2a3c2eff482f9dbaa4a9f"
} %}

{% set version = environ.get('COMMIT_VERSION', None) %}
{% set version = version or versions.keys()|first %}
{% set version = version|string %}

{% set major_version = version.split('.')[0]|int %}
{% set root_tag = (root or '')|replace('.', '') %}

build:
  number: 0
  string: "root{{ root_tag }}"
  # No ROOT dictionary generation currently, but this links against ROOT
  # and could grow one -- pre-emptive protection against conda-build's
  # prefix-relocation corrupting a future lib/*.pcm, matching
  # root-feedstock/root-plus-feedstock's fix for the identical artifact.
  ignore_prefix_files:
    - lib/*.pcm
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x.x") }}

package:
  name: {{ name }}
  version: {{ environ.get('ANACONDA_VERSION', version)|replace("-", ".") }}

source:
  url: "https://rivet.hepforge.org/downloads/?f=Rivet-{{ version }}.tar.gz"
  {% if versions.get(version, None) %}
  sha256: {{ versions.get(version) }}
  {% endif %}
  {% if major_version < 4 %}
  patches:
    - patches/cstdint.patch
  {% endif %}

requirements:
  build:
    - {{ compiler('cxx') }}
    - {{ compiler('c') }}
    - {{ stdlib('c') }}
    - root_base {{ root }}.* cxx{{ root_cxx_standard }}*
    - python
    - make
    - gnuconfig

  host:
    - root_base {{ root }}.* cxx{{ root_cxx_standard }}*
    - python
    - fastjet
    - fastjet-contrib ==1.103
    - zlib
    - hepmc * root{{ root_tag }}
    {% if major_version < 4 %}
    - yoda<2 root{{ root_tag }}
    {% else %}
    - yoda * root{{ root_tag }}
    {% endif %}

  run:
    - python
    - fastjet
    - fastjet-contrib ==1.103
    - zlib
    - {{ pin_compatible('root_base', exact=True) }}
    - hepmc * root{{ root_tag }}

    {% if major_version < 4 %}
    - yoda<2 root{{ root_tag }}
    {% else %}
    - yoda * root{{ root_tag }}
    {% endif %}

about:
  home: "https://rivet.hepforge.org"
  license: "GPL-3.0"
  summary: "Rivet - the particle-physics MC analysis toolkit"
  description: |
    The Rivet toolkit (Robust Independent Validation of Experiment and Theory) is a system for
    validation of Monte Carlo event generators. It provides a large (and ever growing) set of
    experimental analyses useful for MC generator development, validation, and tuning, as well as a
    convenient infrastructure for adding your own analyses.

extra:
  recipe-maintainers:
    - meiyasan
  # Long-Term-Supported in *this channel* -- protected from the anaconda
  # trim's "keep newest 2" rule (see channel-maintenance.yml). 3.1.11 is
  # the rivet<4 line rapgap pins against; the 4.1.3 publish on 2026-10-30
  # trimmed it because it was not listed here.
  lts:
    main:
      - "3.1.11"
